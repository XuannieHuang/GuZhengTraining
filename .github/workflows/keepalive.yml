name: Supabase Keep-Alive
# 每週一、四各 ping 一次 Supabase，讓它被視為「有活動」，
# 避免免費方案閒置約 7 天被自動暫停。
# 用的是 anon 公開金鑰（本來就在前端 config.js 裡，公開安全）。

on:
  schedule:
    - cron: '23 4 * * 1,4'   # UTC 週一、週四 04:23（最長間隔 3~4 天，遠小於 7 天）
  workflow_dispatch:          # 也可在 GitHub「Actions」頁手動按一下觸發

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRveGZ3Y3VodWdycXdpYmdoaWlnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2ODExNjAsImV4cCI6MjA5NzI1NzE2MH0.hzfgb98Kzr1cMEStNdnLchcRlTh7BTvVacGZDTbrw00"
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://toxfwcuhugrqwibghiig.supabase.co/rest/v1/teachers?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY")
          echo "Supabase REST responded HTTP $CODE"
          if [ "$CODE" = "000" ]; then
            echo "連不上（可能已暫停或網路問題）"; exit 1
          fi
          echo "OK — 已戳一下資料庫，重置閒置計時。"
